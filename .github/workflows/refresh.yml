name: Refresh 4MANS Data
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'update_4mans.py'
      - 'scripts/refresh_gate.py'
      - '.github/workflows/refresh.yml'
permissions:
  contents: write
concurrency:
  group: 4mans-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache day
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: fourmans-api-${{ steps.day.outputs.date }}
          restore-keys: fourmans-api-
      - name: Check NFL game window
        id: gate
        run: python scripts/refresh_gate.py
      - name: Refresh and validate Sleeper data
        if: steps.gate.outputs.run == 'true'
        env:
          SLEEPER_PLAYERS_CACHE: .cache/players.json
          FOURMANS_GAME_WINDOW: ${{ steps.gate.outputs.game_window }}
        run: python update_4mans.py
      - name: Publish refreshed JSON
        if: steps.gate.outputs.run == 'true'
        run: |
          if git diff --quiet -- 4mans_app_data.json; then
            exit 0
          fi
          git config user.name "4MANS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add 4mans_app_data.json
          git commit -m "Auto-refresh 4MANS data"
          # Publish only the data change on the newest main, preserving code edits.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
