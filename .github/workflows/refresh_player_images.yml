name: Refresh 4MANS Images

on:
  workflow_dispatch:
  schedule:
    # Refresh/freeze current player, manager, and league images each August 30.
    - cron: '0 12 30 8 *'

permissions:
  contents: write

concurrency:
  group: refresh-4mans-images
  cancel-in-progress: false

jobs:
  refresh-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build latest 4MANS data
        run: python update_4mans.py

      - name: Refresh player, manager, and league images
        run: python refresh_player_images.py --refresh-existing

      - name: Commit image assets and refreshed data
        run: |
          if git diff --quiet -- assets/players assets/managers assets/leagues 4mans_app_data.json; then
            echo "No image or data changes."
            exit 0
          fi
          git config user.name "4MANS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/players assets/managers assets/leagues 4mans_app_data.json
          git commit -m "Refresh 4MANS images"
          git push
