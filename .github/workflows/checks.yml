name: Check 4MANS
on:
  pull_request:
  push:
    paths:
      - 'index.html'
      - 'preview/**'
      - 'supabase/**'
      - 'scripts/**'
      - 'tests/**'
      - 'update_4mans.py'
      - 'package*.json'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
        env:
          FOURMANS_HTML: preview/index.html
